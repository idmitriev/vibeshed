name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      APP_NAME: Vibeshed
      BUNDLE_ID: com.ivandmitriev.Vibeshed
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build and sign .app
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_NUMBER=$(git rev-list --count HEAD)
          APP_BUNDLE=".build/${APP_NAME}.app"

          swift --version
          swift build -c release

          mkdir -p "$APP_BUNDLE/Contents/MacOS" "$APP_BUNDLE/Contents/Resources"
          cp ".build/release/${APP_NAME}" "$APP_BUNDLE/Contents/MacOS/${APP_NAME}"
          cp Resources/AppIcon.icns "$APP_BUNDLE/Contents/Resources/AppIcon.icns"

          sed \
            -e "s/\$(EXECUTABLE_NAME)/${APP_NAME}/g" \
            -e "s/\$(PRODUCT_BUNDLE_IDENTIFIER)/${BUNDLE_ID}/g" \
            -e "s/\$(PRODUCT_NAME)/${APP_NAME}/g" \
            -e "s/\$(DEVELOPMENT_LANGUAGE)/en/g" \
            -e "s/\$(MARKETING_VERSION)/${VERSION}/g" \
            -e "s/\$(BUILD_VERSION)/${BUILD_NUMBER}/g" \
            Vibeshed/Info.plist > "$APP_BUNDLE/Contents/Info.plist"

          # Ad-hoc signature: no Developer ID, not notarized. Apple Silicon
          # refuses to run unsigned arm64 code, so an ad-hoc seal is the minimum.
          codesign --force --sign - \
            --entitlements Vibeshed/Vibeshed.entitlements \
            --identifier "$BUNDLE_ID" \
            --options runtime \
            "$APP_BUNDLE"

          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"

      - name: Package release artifact
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_BUNDLE=".build/${APP_NAME}.app"
          ZIP_NAME="${APP_NAME}-${VERSION}.zip"
          ZIP_PATH="${RUNNER_TEMP}/${ZIP_NAME}"
          /usr/bin/ditto -c -k --keepParent "$APP_BUNDLE" "$ZIP_PATH"
          SHA256=$(shasum -a 256 "$ZIP_PATH" | awk '{print $1}')
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "$SHA256  $ZIP_NAME" > "${RUNNER_TEMP}/${ZIP_NAME}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          generate_release_notes: true
          body: |
            ## Install

            Download `${{ steps.package.outputs.zip_name }}`, unzip, and drag `Vibeshed.app` to `/Applications`.

            **Homebrew:**
            ```
            brew install --cask idmitriev/tap/vibeshed
            ```

            ### First launch (unnotarized build)

            This build is ad-hoc signed and **not notarized**, so Gatekeeper blocks it on first launch. Either:

            - Open it once, dismiss the warning, then go to **System Settings → Privacy & Security** and click **Open Anyway**, or
            - Clear the quarantine flag from Terminal:
              ```
              xattr -dr com.apple.quarantine /Applications/Vibeshed.app
              ```

            Because the signature changes with every build, macOS will ask you to re-grant Accessibility (and other) permissions after each update. Remove the old Vibeshed entry in Privacy & Security before re-adding it.

            **SHA-256:** `${{ steps.package.outputs.sha256 }}`
          files: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.zip_path }}.sha256
