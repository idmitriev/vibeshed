name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Test (release build)
        # Releases ship -c release; 0.8.0's museum searches broke only when optimized.
        run: swift test -c release -Xswiftc -enable-testing
      - name: Lint
        run: |
          SWIFTLINT=.build/artifacts/swiftlintplugins/SwiftLintBinary/SwiftLintBinary.artifactbundle/macos/swiftlint
          if [ -x "$SWIFTLINT" ]; then "$SWIFTLINT" lint --strict --reporter github-actions-logging; else echo "SwiftLint binary not found, skipping"; fi
