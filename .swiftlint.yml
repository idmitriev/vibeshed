excluded:
  - .build
  - .claude
  - .swiftpm
  - VibeshedUITests
  - Vibeshed/Modules/Emoji/EmojiData.swift # generated by scripts/generate-emoji.py

line_length:
  warning: 120
  error: 150
  ignores_comments: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 60
  error: 100

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - x
    - y

# Match SwiftFormat's output so the two tools don't fight: its
# wrapMultilineStatementBraces rule puts `{` on its own line after a wrapped
# condition or signature, and its modifierOrder puts access control before
# isolation (`private nonisolated`).
opening_brace:
  ignore_multiline_type_headers: true
  ignore_multiline_statement_conditions: true
  ignore_multiline_function_signatures: true

modifier_order:
  preferred_modifier_order:
    - override
    - acl
    - setterACL
    - isolation
    - dynamic
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

disabled_rules:
  - trailing_comma
  - large_tuple
  - todo
  - void_function_in_ternary

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_string
  - first_where
  - modifier_order
  - overridden_super_call
  - private_action
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
