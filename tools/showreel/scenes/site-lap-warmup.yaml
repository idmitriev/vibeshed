# Not a video: teaches the picker the lap's results and warms everything up.
# Vibeshed ranks by usage, so each round runs, from the picker, every action the
# lap takes from the top of the list: Restore Minimized Windows, the Spotify app
# and what's playing, Search Pull Requests, Switch Theme, Tile Left Half, Attach
# All Windows to Grid and Minimize All Windows. Usage counts per action, not per
# query, so each is reached by a query that already ranks it first, and `select`
# checks the preview shows it before Return. Then one pass through the lap's themes, so Zed's
# one-time theme reload and the first wallpaper renders happen off camera, and
# screenshots of each query to check the ranking (out/site-lap-warmup/q-*.png).
title: "Warm-up: the lap's picker ranking"

setup:
  display: { width: 1600, height: 1000 }
  locale: en_US
  dock: hidden
  menuBar: hidden
  desktopIcons: hidden
  desktopWidgets: hidden
  vibeshed:
    config: [../configs/site-videos.yaml, ../configs/site-search.yaml]
    reset: false                       # keep (and add to) the usage it learns
  apps:
    - { app: Spotify, frame: [840, 560, 720, 400] }
    - { app: Safari, open: "https://en.wikipedia.org/wiki/Caps_Lock", frame: [40, 60, 700, 480] }
    - { app: Ghostty, frame: [900, 260, 660, 480] }
    - { app: Zed, open: ~/code/vibeshed/Vibeshed/Picker/PickerView.swift, frame: [300, 120, 760, 560] }
  # No sample event here: its row refreshes its countdown and resets the selection, so a
  # Return meant for the row below would open its Zoom link.
  focus: Zed
  actions:
    - open: vibeshed://theme/apply.vibeshed-glow
    - shell: open "spotify:track:2PzU4IB8Dr6mxV3lHuaG34"
    - wait: 4
  settle: 2

record: { video: false, pauseOnDialogs: true }

