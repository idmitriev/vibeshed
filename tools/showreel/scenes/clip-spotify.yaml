# Loop for the website: search Spotify playlists from the picker and open one
# in the Spotify app. Needs spotify-login once (Web API tokens) and the Spotify
# app signed in in the VM.
title: "Clip: Spotify playlists"

setup:
  display: { width: 1280, height: 800 }
  appearance: dark
  wallpaper: "#120d16"            # the website's --bg
  locale: en_US
  dock: hidden
  desktopIcons: hidden
  desktopWidgets: hidden
  # The system accent back to default (the theme clips change it).
  prepare: defaults delete -g AppleAccentColor 2>/dev/null; defaults delete -g AppleHighlightColor 2>/dev/null; true
  vibeshed:
    config: [../configs/clips.yaml, ../configs/clips-content.yaml]
    keystrokes: true
  apps:
    - { app: Spotify, frame: [90, 45, 1100, 700] }
  focus: Spotify
  actions:
    - open: vibeshed://theme/apply.vibeshed   # fixed picker colors (see clips.yaml)
    - wait: 0.8
  settle: 3

record: { leadIn: 0.3, leadOut: 0.3 }

actions:
  - marker: start
  - wait: 0.5                     # still frame for the loop to fade into
  - press: capslock+space
  - waitFor: picker
  - wait: 0.6                     # the list settles after opening
  - type: { text: search spotify, cps: 18 }
  - waitFor: { result: Search Spotify }
  - wait: 0.2
  - press: return
  - wait: 0.5
  - type: { text: lofi, cps: 12 }
  - press: return
  - marker: searching
  - waitFor: { result: lofi, timeout: 15 }
  - marker: results
  - wait: 0.8
  - press: { keys: down, times: 2, interval: 0.5 }
  - wait: 0.7
  - press: return
  - waitFor: { window: picker, gone: true }
  - marker: opened
  - wait: 2.5                     # the playlist page loads in Spotify
  - marker: end

outputs:
  # The whole 1280×800 display below the menu bar.
  - { name: spotify, crop: [0, 30, 1280, 770], width: 1280, from: start, to: end, loop: 0.5, skip: [[searching+0.5, results-0.1]] }
  - { name: spotify, format: webm, crop: [0, 30, 1280, 770], width: 1280, from: start, to: end, loop: 0.5, skip: [[searching+0.5, results-0.1]] }
  - { name: spotify-poster, format: png, crop: [0, 30, 1280, 770], width: 1280, at: results+1.6 }
