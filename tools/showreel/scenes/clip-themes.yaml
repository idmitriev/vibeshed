# Loop for the website: the picker recolors live while you arrow through
# palette themes; Escape puts the original back, so the loop closes.
title: "Clip: palette themes"

setup:
  display: { width: 1280, height: 800 }
  appearance: dark
  wallpaper: "#120d16"            # the website's --bg
  locale: en_US
  dock: hidden
  desktopIcons: hidden
  desktopWidgets: hidden
  # The theme clip's accent target changes the system accent; start from the
  # default so the picker's match highlights look the same in every clip.
  prepare: defaults delete -g AppleAccentColor 2>/dev/null; defaults delete -g AppleHighlightColor 2>/dev/null; true
  vibeshed:
    config: ../configs/clips.yaml
    keystrokes: true
  actions:
    - open: vibeshed://theme/apply.vibeshed   # fixed picker colors (see clips.yaml)
    - wait: 0.8

record: { leadIn: 0.3, leadOut: 0.3 }

actions:
  - marker: start
  - wait: 0.5                     # still background for the loop to fade into
  - press: capslock+space
  - waitFor: picker
  - wait: 0.6                     # the list settles after opening
  - type: { text: switch theme, cps: 18 }
  - waitFor: { result: Switch Theme }    # "theme" alone ranks Previous Theme first
  - wait: 0.2
  - press: return
  - wait: 0.5
  - press: { keys: down, times: 3, interval: 0.65 }
  - wait: 0.6
  - marker: browsing
  - press: { keys: escape, times: 2, interval: 0.25 }
  - waitFor: { window: picker, gone: true }
  - wait: 0.4
  - marker: end

outputs:
  # The picker plus the keystroke chips under it. `loop` fades the end back
  # into the start, so <video loop> cycles without a seam.
  - { name: themes, crop: [230, 190, 820, 580], width: 1280, from: start, to: end, loop: 0.5 }
  - { name: themes, format: webm, crop: [230, 190, 820, 580], width: 1280, from: start, to: end, loop: 0.5 }
  - { name: themes-poster, format: png, crop: [230, 190, 820, 580], width: 1280, at: browsing }
