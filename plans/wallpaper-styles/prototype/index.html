<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Wallpaper prototypes</title>
<style>
  body { margin: 0; background: #222; color: #ddd; font: 13px -apple-system, system-ui, sans-serif; }
  form { padding: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  canvas { display: block; max-width: 100%; }
</style>
</head>
<body>
<!-- Open in a browser: index.html?style=flow&theme=tokyoNight&w=1440&h=900&v=0
     (v changes the seed, the way theme/shuffleWallpaper adds a variation in Vibeshed). -->
<form id="f">
  <select name="style"></select>
  <select name="theme"></select>
  <label>w <input name="w" size="5" value="1440"></label>
  <label>h <input name="h" size="5" value="900"></label>
  <label>variation <input name="v" size="3" value="0"></label>
  <button>Render</button> <span id="ms"></span>
</form>
<canvas id="c"></canvas>
<script src="wallpapers.js"></script>
<script>
// Headless entry point used by render.mjs.
window.render = function (styleName, themeDef, slug, width, height, variation) {
  const cv = document.getElementById('c');
  cv.width = width; cv.height = height;
  const wall = new Wall(cv, resolvePalette(themeDef), fnv1a32(slug + ':' + (variation || 0)));
  const t0 = performance.now();
  STYLES[styleName](wall);
  return { ms: Math.round(performance.now() - t0), png: cv.toDataURL('image/png') };
};

// Interactive viewer (needs the page served over http so themes.json can load:
// `python3 -m http.server` in this folder, then open http://localhost:8000/).
(async () => {
  let themes;
  try { themes = await (await fetch('themes.json')).json(); } catch { return; }
  const form = document.getElementById('f'), q = new URLSearchParams(location.search);
  for (const s of Object.keys(STYLES)) form.style.add(new Option(s, s));
  for (const [slug, t] of Object.entries(themes)) form.theme.add(new Option(t.name, slug));
  for (const k of ['style', 'theme', 'w', 'h', 'v']) if (q.has(k)) form[k].value = q.get(k);
  if (!q.has('theme')) form.theme.value = 'tokyoNight';
  const go = () => {
    const r = window.render(form.style.value, themes[form.theme.value], form.theme.value, +form.w.value, +form.h.value, +form.v.value);
    document.getElementById('ms').textContent = r.ms + ' ms';
  };
  form.onsubmit = e => { e.preventDefault(); history.replaceState(null, '', '?' + new URLSearchParams(new FormData(form))); go(); };
  go();
})();
</script>
</body>
</html>
