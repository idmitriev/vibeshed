# Vibeshed config for showreel scenes: what a new user's picker looks like,
# with nothing personal in it. Scenes copy it to the VM's
# ~/.config/vibeshed/config.yaml before relaunching Vibeshed.

appearance:
  overlay:
    blur: 24
    opacity: 0.2

keybindings:
  - combo: "capslock+space"
    action: "app/togglePicker"
  - combo: "capslock+left"
    action: "window/tileLeft"
  - combo: "capslock+right"
    action: "window/tileRight"
  - combo: "capslock+up"
    action: "window/maximize"

modules:
  window:
  # Vibeshed 0.6.1 needs every key of these sections (it has no per-key
  # defaults yet), so they mirror config.example.yaml.
  application:
    showRunningOnly: false
    cacheTTLSeconds: 3.0
    excludedBundleIDs:
      - "com.apple.Dock"
      - "com.apple.loginwindow"
  system:
    screenshotPath: "~/Screenshots"
    enabledActions:
      - lock
      - sleep
      - toggleAppearance
      - toggleDock
      - emptyTrash
      - screenshotInteractive
  # pasteOnSelect would send ⌘V while the picker still has focus; scenes press
  # ⌘V themselves once it closes.
  clipboard:
    maxItems: 50
    pollingInterval: 0.5
    showClearAction: true
    pasteOnSelect: false
    excludePatterns: []
  math:
    decimalPlaces: 6
    enableCurrency: false
    currencyRateTTL: 3600
    copyOnSelect: true
    showBaseConversions: true
  emoji:
    maxResults: 8
  websearch:
    minQueryLength: 2
    engines:
      - name: "Google"
        urlTemplate: "https://www.google.com/search?q={query}"
  # Scenes turn the keystroke visualizer on through self/toggleKeystrokeVisualizer.
  self:
    enabledActions:
      - toggleKeystrokeVisualizer
      - openConfig
      - reloadConfig
