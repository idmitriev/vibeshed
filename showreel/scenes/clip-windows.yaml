# Loop for the website: four messy windows snap into a 2×2 grid with one
# keystroke, then two trade places. The loop fades back to the mess.
title: "Clip: window tiling"

setup:
  display: { width: 1280, height: 800 }
  appearance: dark
  wallpaper: "#120d16"            # the website's --bg
  locale: en_US
  dock: hidden
  desktopIcons: hidden
  desktopWidgets: hidden
  # The theme clip's accent target changes the system accent; start from the
  # default so the picker's match highlights look the same in every clip.
  prepare: defaults delete -g AppleAccentColor 2>/dev/null; defaults delete -g AppleHighlightColor 2>/dev/null; true
  vibeshed:
    config: ../configs/clips.yaml
    keystrokes: true
  apps:
    - { app: Spotify, frame: [690, 330, 560, 440] }
    - { app: Safari, open: "https://github.com/idmitriev/vibeshed", frame: [50, 50, 760, 520] }
    - { app: Visual Studio Code, open: ../../Vibeshed/Picker/FuzzyMatcher.swift, frame: [440, 150, 780, 540] }
    - { app: Ghostty, frame: [140, 370, 620, 400] }
  focus: Ghostty
  actions:
    - open: vibeshed://theme/apply.vibeshed   # fixed picker colors (see clips.yaml)
    - wait: 0.8
    - type: { text: "export PS1='%F{205}❯%f '; clear", cps: 60 }
    - press: return
    - type: { text: "fastfetch --structure OS:Kernel:Uptime:Packages:Shell:Terminal:CPU:Memory:Colors", cps: 80 }
    - press: return
  settle: 4

record: { leadIn: 0.3, leadOut: 0.3 }

actions:
  - marker: start
  - wait: 0.6                     # still frame for the loop to fade into
  - press: capslock+t             # tiling/attachAll
  - wait: 1.4
  - marker: tiled
  - press: capslock+s             # swap the focused window with the next split
  - wait: 1.2
  - press: capslock+s
  - wait: 1.0
  - marker: end

outputs:
  # The whole 1280×800 display below the menu bar.
  - { name: windows, crop: [0, 30, 1280, 770], width: 1280, from: start, to: end, loop: 0.5 }
  - { name: windows, format: webm, crop: [0, 30, 1280, 770], width: 1280, from: start, to: end, loop: 0.5 }
  - { name: windows-poster, format: png, crop: [0, 30, 1280, 770], width: 1280, at: tiled }
