# Loop for the website: jump to any open browser tab by its title. Safari:
# Vibeshed 0.6.1 can list Chrome's tabs but not switch to them (its focus
# script asks Chrome for `miniaturized`, which Chrome doesn't have).
title: "Clip: browser tabs"

setup:
  display: { width: 1280, height: 800 }
  appearance: dark
  wallpaper: "#120d16"            # the website's --bg
  locale: en_US
  dock: hidden
  desktopIcons: hidden
  desktopWidgets: hidden
  sync: [../fixtures/demo-data.py]
  # Sample projects, Claude sessions and VS Code recents; the system accent
  # back to default (the theme clip changes it).
  prepare: |
    defaults delete -g AppleAccentColor 2>/dev/null; defaults delete -g AppleHighlightColor 2>/dev/null
    python3 "$SCENE_DIR/../fixtures/demo-data.py"
  vibeshed:
    config: [../configs/clips.yaml, ../configs/clips-content.yaml]
    keystrokes: true
  apps:
    - { app: Safari, open: "https://ivandmitriev.com/vibeshed/", frame: [90, 45, 1100, 700] }
  focus: Safari
  # More tabs, then the site again so it's the one in front.
  shell: |
    for url in https://github.com/idmitriev/vibeshed https://news.ycombinator.com \
        https://developer.apple.com/documentation/swiftui https://en.wikipedia.org/wiki/Keyboard_shortcut \
        https://ivandmitriev.com/vibeshed/; do
      open -a Safari "$url"; sleep 0.6
    done
  actions:
    - open: vibeshed://theme/apply.vibeshed   # fixed picker colors (see clips.yaml)
    - wait: 0.8
  settle: 4

record: { leadIn: 0.3, leadOut: 0.3 }

actions:
  - marker: start
  - wait: 0.5                     # still frame for the loop to fade into
  - press: capslock+space
  - waitFor: picker
  - wait: 0.6                     # the list settles after opening
  - type: { text: swiftui, cps: 14 }
  - waitFor: { result: SwiftUI }
  - wait: 0.4
  - press: return
  - waitFor: { window: picker, gone: true }
  - wait: 1.2
  - marker: switched
  - press: capslock+space
  - waitFor: picker
  - wait: 0.4
  - type: { text: hacker news, cps: 16 }
  - waitFor: { result: Hacker News }
  - wait: 0.4
  - press: return
  - waitFor: { window: picker, gone: true }
  - wait: 1.2
  - marker: end

outputs:
  # The whole 1280×800 display below the menu bar.
  - { name: tabs, crop: [0, 30, 1280, 770], width: 1280, from: start, to: end, loop: 0.5 }
  - { name: tabs, format: webm, crop: [0, 30, 1280, 770], width: 1280, from: start, to: end, loop: 0.5 }
  - { name: tabs-poster, format: png, crop: [0, 30, 1280, 770], width: 1280, at: switched }
