# Loop for the website: reopen a recent VS Code project from the picker.
title: "Clip: VS Code projects"

setup:
  display: { width: 1280, height: 800 }
  appearance: dark
  wallpaper: "#120d16"            # the website's --bg
  locale: en_US
  dock: hidden
  desktopIcons: hidden
  desktopWidgets: hidden
  sync: [../fixtures/demo-data.py]
  # Sample projects, Claude sessions and VS Code recents; the system accent
  # back to default (the theme clip changes it).
  prepare: |
    defaults delete -g AppleAccentColor 2>/dev/null; defaults delete -g AppleHighlightColor 2>/dev/null
    python3 "$SCENE_DIR/../fixtures/demo-data.py"
  vibeshed:
    config: [../configs/clips.yaml, ../configs/clips-content.yaml]
    keystrokes: true
  actions:
    - open: vibeshed://theme/apply.vibeshed   # fixed picker colors (see clips.yaml)
    - wait: 0.8

record: { leadIn: 0.3, leadOut: 0.3 }

actions:
  - marker: start
  - wait: 0.5                     # still frame for the loop to fade into
  - press: capslock+space
  - waitFor: picker
  - wait: 0.6                     # the list settles after opening
  - type: { text: forecast, cps: 14 }
  - waitFor: { result: forecast-api }
  - wait: 0.6
  - marker: found
  - press: return
  - waitFor: { window: picker, gone: true }
  - marker: opening
  - waitFor: { window: Visual Studio Code, title: forecast-api, timeout: 20 }
  - window: { app: Visual Studio Code, frame: [0, 30, 1280, 770] }   # inside the cut
  - wait: 0.8                     # the README preview renders
  - marker: opened
  - wait: 1.6
  - marker: end

outputs:
  # The whole 1280×800 display below the menu bar.
  - { name: projects, crop: [0, 30, 1280, 770], width: 1280, from: start, to: end, loop: 0.5, skip: [[opening+0.4, opened-0.2]] }
  - { name: projects, format: webm, crop: [0, 30, 1280, 770], width: 1280, from: start, to: end, loop: 0.5, skip: [[opening+0.4, opened-0.2]] }
  - { name: projects-poster, format: png, crop: [0, 30, 1280, 770], width: 1280, at: found }
